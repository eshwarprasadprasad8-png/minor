{% extends "base.html" %}

{% block title %}Forgot Password - EduPath AI{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 hero-gradient">
    <div class="col-md-5">
        <div class="card glass-card p-4 my-5 border-0">
            <div class="card-body">
                <div class="text-center mb-4">
                    <h2 class="text-white"><i class="fa-solid fa-key text-cyan me-2"></i>Reset Password</h2>
                    <p class="text-muted">Enter your registered username or email to set a new password</p>
                </div>
                
                <form action="{{ url_for('auth.forgot_password') }}" method="POST">
                    <!-- Username or Email Input -->
                    <div class="mb-3">
                        <label for="identifier" class="form-label form-label-custom">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-secondary text-muted"><i class="fa-regular fa-envelope"></i></span>
                            <input type="text" class="form-control form-control-custom" id="identifier" name="identifier" placeholder="Enter your username or email" required>
                        </div>
                    </div>

                    <!-- New Password Input -->
                    <div class="mb-3">
                        <label for="new_password" class="form-label form-label-custom">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-secondary text-muted"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control form-control-custom" id="new_password" name="new_password" placeholder="Enter new password (min. 6 characters)" required minlength="6">
                        </div>
                    </div>

                    <!-- Confirm New Password Input -->
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label form-label-custom">Confirm New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-secondary text-muted"><i class="fa-solid fa-shield-halved"></i></span>
                            <input type="password" class="form-control form-control-custom" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" required minlength="6">
                        </div>
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-premium w-100 mb-3">
                        <i class="fa-solid fa-check-circle me-2"></i>Reset Password
                    </button>
                </form>
                
                <div class="text-center">
                    <p class="mb-0 text-muted">Remembered your password? 
                        <a href="{{ url_for('auth.login') }}" class="text-cyan text-decoration-none font-weight-bold">Back to Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
