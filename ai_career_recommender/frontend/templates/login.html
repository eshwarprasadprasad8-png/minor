{% extends "base.html" %}

{% block title %}Login - EduPath AI{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 hero-gradient">
    <div class="col-md-5">
        <div class="card glass-card p-4 my-5 border-0">
            <div class="card-body">
                <div class="text-center mb-4">
                    <h2 class="text-white"><i class="fa-solid fa-user-lock text-cyan me-2"></i>Sign In</h2>
                    <p class="text-muted">Access your personalized dashboard & recommendations</p>
                </div>
                
                <form action="{{ url_for('auth.login') }}" method="POST">
                    <!-- Username Input -->
                    <div class="mb-3">
                        <label for="username" class="form-label form-label-custom">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-secondary text-muted"><i class="fa-regular fa-user"></i></span>
                            <input type="text" class="form-control form-control-custom" id="username" name="username" placeholder="Enter username" required>
                        </div>
                    </div>
                    
                    <!-- Password Input -->
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label form-label-custom mb-0">Password</label>
                            <a href="{{ url_for('auth.forgot_password') }}" class="text-cyan text-decoration-none small">Forgot Password?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-secondary text-muted"><i class="fa-solid fa-key"></i></span>
                            <input type="password" class="form-control form-control-custom" id="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-premium w-100 mb-3">
                        <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
                    </button>
                </form>
                
                <div class="text-center">
                    <p class="mb-0 text-muted">Don't have an account? 
                        <a href="{{ url_for('auth.register') }}" class="text-cyan text-decoration-none font-weight-bold">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
